name: Build Jellyfin image
on:
  schedule:
    - cron: '23 0 * * 1'
  push:
    branches: [main]
    paths: [Dockerfile, .dockerignore, 'scripts/**', '.github/workflows/**']
  workflow_dispatch:
    inputs:
      force:
        description: 强制重建（例如刷新 Debian 包）
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: jellyfin-image
  cancel-in-progress: false
jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: base
        run: scripts/resolve.sh
      - id: check
        env:
          IMAGE: ${{ steps.base.outputs.image }}
          KEY: ${{ steps.base.outputs.key }}
          FORCE: ${{ inputs.force || false }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$FORCE" = true ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A new GHCR package can return denied instead of manifest unknown.
          # Confirm package absence via GitHub API; never hide registry/network errors.
          status=$(curl --silent --show-error -o /tmp/package.json -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/jellyfin")
          if [ "$status" = 404 ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" != 200 ]; then
            echo "Package lookup failed: HTTP $status" >&2
            exit 1
          elif docker buildx imagetools inspect "$IMAGE:build-$KEY" > /tmp/manifest.txt 2>/tmp/manifest.err; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo 'Base digest and build definition unchanged; skipped.' >> "$GITHUB_STEP_SUMMARY"
          elif grep -Eiq 'not found|manifest unknown|MANIFEST_UNKNOWN' /tmp/manifest.err; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            cat /tmp/manifest.err >&2
            exit 1
          fi
      - id: metadata
        if: steps.check.outputs.build == 'true'
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          docker pull --platform linux/amd64 "$BASE"
          version=$(docker image inspect "$BASE" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          [[ "$version" =~ ^[a-zA-Z0-9._+-]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: build
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE=${{ steps.base.outputs.base }}
          tags: |
            ${{ steps.base.outputs.image }}:latest
            ${{ steps.base.outputs.image }}:build-${{ steps.base.outputs.key }}
            ${{ steps.base.outputs.image }}:run-${{ github.run_id }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.metadata.outputs.version }}
            org.opencontainers.image.base.name=docker.io/jellyfin/jellyfin:latest
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}
            io.ckopoer.jellyfin.build-key=${{ steps.base.outputs.key }}
      - if: steps.check.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.base.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          BASE: ${{ steps.base.outputs.base }}
        run: |
          echo "Published: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Base: $BASE" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback: $IMAGE:run-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_STEP_SUMMARY"
